[project]
name = "slim-espnet"
dynamic = ["version", "readme"]
authors = [
    {name="Jeff Chen", email="zhanfeng.chen@outlook.com"}
]
description = "Slim ESPnet: end-to-end speech processing toolkit slim version"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12,<3.14"
license = { "text" = "Apache Software License" }

# We didn't specify torch-related packages as it highly depends on environment.
dependencies = [
    "setuptools>=77.0.3,<82",
    "configargparse>=1.2.1",
    "packaging",
    "typeguard",
    "humanfriendly",
    "scipy>=1.4.1",
    "numpy>=2.0.0",
    "PyYAML>=5.1.2",
    "soundfile>=0.10.2",
    "omniio>=0.1.2",
    "filelock",
    # "sentencepiece==0.2.1",
    "sentencepiece>=0.2.1,<0.3.0",
    "librosa>=0.10.2",
    "torch_complex",
    "einops",
    "tqdm>=4.64",
    # "espnet_model_zoo",    # vendored in project
    "torch>=2.11.0,!=2.12.0,!=2.12.1,<2.15",
    "torchaudio>=2.11.0,<2.12",
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/jeffchen0325/slim-espnet"

[project.scripts]
espnet = "espnet2.bin.cli:main"
espnet-mcp = "espnet2.bin.mcp_server:main"

[build-system]
requires = ["setuptools>=77.0.3,<82", "wheel", "setuptools-scm>=8.0,<9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "version.txt"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
include = ["egs*", "espnet*", "tasks", "tasks.*"]

[tool.setuptools.package-data]
tasks = ["tasks/**/*.yaml"]

[project.optional-dependencies]
# Training, with espnet2 (espnet2/bin/*_train.py, egs2 recipes) or espnet3
# (espnet3/, egs3/: Hydra configs, the Lightning trainer, Hugging Face
# datasets, Dask for the parallel/ helpers). Every one of these was a hard
# dependency until 202609, so `pip install espnet` dragged W&B, Lightning,
# TensorBoard and Dask into installs that only ever ran a model. abs_task.py
# and espnet2/train import wandb, torch_optimizer and matplotlib lazily;
# lightning_train.py, the Lightning callbacks, the speechlm trainers and
# espnet3 import theirs at module level and are training entry points.
train = [
  "lightning",
  "tensorboard>=1.14",
  "torch_optimizer",
  "matplotlib",
  "nltk>=3.4.5",
  "wandb",
  # CER/WER during validation (legacy/nets/e2e_asr_common.py, the transducer
  # error calculator, uasr/espnet_model.py); also in [asr].
  "editdistance",
  "hydra-core",
  "omegaconf",
  "datasets",
  "dask[distributed]",
  "dask_jobqueue",
]
# Three of the packages below are ESPnet-maintained forks of projects whose
# upstream releases do not work here, published to PyPI under their own names:
# espnet-ctc-segmentation, espnet-g2p-en and espnet-s3prl. Their import names
# are unchanged (ctc_segmentation, g2p_en, s3prl), and each carries a
# FORK_NOTICE.md saying what differs from upstream and why.
#
# They must be declared like this, by name and version. A direct reference -
# "name @ git+https://..." - makes PyPI reject the whole distribution with
# 400 Can't have direct dependency, which is what kept ESPnet off PyPI from
# v.202604 to v.202609 with nothing local reporting it. ci/check_ci_image_config.py
# now fails on one.
asr = [
  "espnet-ctc-segmentation>=1.7.4.post1",  # fork of lumaku/ctc-segmentation
  "editdistance",
  "opt_einsum",
  "jiwer",
]

tts = [
  "pyworld>=0.3.4",
  "pypinyin<=0.44.0",
  "espnet_tts_frontend",    # to be vendored later
  "espnet-g2p-en>=2.1.0.post1",  # fork of Kyubyong/g2p
  "jamo==0.4.1",
  "jaconv",
]

enh = [
  "ci_sdr",
  "fast-bss-eval==0.1.3",
]

asr2 = [
  "editdistance",
]

s2st = [
  "editdistance",
  "espnet-s3prl>=2026.5.14",  # fork of s3prl/s3prl
]

st = [
  "editdistance",
]

s2t = [
  "editdistance",
]

spk = [
  "asteroid_filterbanks==0.4.0"
]

egs = [
  "slim-espnet[train]",
  "gdown",
  "resampy",
  "pysptk>=0.2.1",
  "morfessor",
  "yt-dlp>=2024.0.0",
  "nnmnkwii",
  "museval>=0.2.1",
  "pystoi>=0.2.2",
  "mir-eval>=0.6",
  "fastdtw",
  "nara_wpe>=0.0.5",
  "sacrebleu>=1.5.1",
  "praatio>=6,<7",
  "scikit-learn>=1.0.0",
]

# Dependencies for SpeechLM training (espnet2/speechlm).
# Shared packages are supplied by the base dependencies above.
speechlm = [
  "lhotse",
  # dataloader/batch.py and the polars/duckdb loaders import these at module
  # level; until the training stack left the core dependencies they arrived
  # through dask[distributed] and datasets, undeclared.
  "sortedcontainers",
  "pyarrow",
  "psutil",
  "transformers>=5.14.0,<5.16.0",
  "huggingface-hub",
  "joblib",
  "polars",
  "duckdb",
  # Keep Linux training dependencies off Windows/macOS installs.
  "torchtitan; sys_platform == 'linux'",
  "liger-kernel; sys_platform == 'linux'",
  "flash-linear-attention>=0.2.2; sys_platform == 'linux'",
  "tilelang>=0.1.12; sys_platform == 'linux'",
]

# Extras for the spoken dialogue system demo (espnet2/sds and
# egs2/TEMPLATE/sds1). None of these were declared anywhere, so there was no
# supported way to install that module from the repo.
sds = [
  "pydub",
  "snac",
  # 0.4.3 is the release the vendored mini-omni code was adapted from, and the
  # last one without an upper bound on huggingface-hub. Newer litgpt pins
  # huggingface-hub<1.4, which cannot be satisfied together with gradio's
  # >=1.16, so leaving this unpinned makes pip quietly downgrade gradio.
  "litgpt==0.4.3",
  "openai-whisper",
  # Prebuilt wheels, unlike the original webrtcvad which needs a compiler.
  "webrtcvad-wheels",
  "gradio",
  "transformers>=5.14.0,<5.16.0",
]

# The browser demo (espnet2/bin/demo.py): `espnet demo` serves the OWSM app
# the Hugging Face Spaces run. gradio is the only thing it needs beyond a bare
# install, and it stays here rather than in the core dependencies because a
# web framework has no business in `pip install espnet`: the command imports
# it inside the function that builds the app and names this extra when it is
# missing. Not in [all], for the reason [sds] is not - one demo must not drag
# gradio into every install.
demo = [
  "gradio",
]

# Model Context Protocol server (espnet2/bin/mcp_server.py): the `espnet-mcp`
# command through which Claude Code, Cursor and other agents call ESPnet as
# tools. It pulls the three task extras because its default tools cover ASR,
# TTS and enhancement.
mcp = [
  "mcp>=2.0",
  "slim-espnet[asr]",
  "slim-espnet[tts]",
  "slim-espnet[enh]",
]

dev = [
  "black",
  "flake8>=3.7.8",
  "pytest>=7.0.0,<8.4.0",
  "pytest-cov>=2.7.1",
  "isort",
]

test = [
  "slim-espnet[train]",
  "pytest>=7.0.0,<8.4.0",
  "pytest-timeouts>=1.2.1",
  "pytest-pythonpath>=0.7.3",
  "pytest-cov>=2.7.1",
  "hacking>=2.0.0",
  "mock>=2.0.0",
  "pycodestyle",
  "jsondiff>=2.0.0",
  "flake8>=3.7.8",
  "flake8-docstrings>=1.3.1",
  "black",
  "isort",
  "h5py>=2.10.0",
  "gradio",
  "playwright",
  # test_mcp_server.py imports mcp outright; macOS CI installs only .[test].
  "mcp>=2.0",
]

doc = [
  "sphinx<9.0.0",
  "sphinx-rtd-theme>=0.2.4",
  "myst-parser",
  "sphinx-argparse>=0.2.5",
  "sphinx-markdown-builder",
  "sphinx-markdown-tables"
]

# Every task extra plus training. Not sds: it pins litgpt==0.4.3 and pulls
# openai-whisper and gradio for one demo, and would drag those into every
# `pip install slim-espnet[all]`; install it by name.
all = [
  "slim-espnet[train]",
  "slim-espnet[asr]",
  "slim-espnet[asr2]",
  "slim-espnet[tts]",
  "slim-espnet[enh]",
  "slim-espnet[st]",
  "slim-espnet[s2t]",
  "slim-espnet[s2st]",
  "slim-espnet[spk]",
  "slim-espnet[speechlm]",
  "slim-espnet[egs]",
  "slim-espnet[mcp]",
  "fairscale",
  "evaluate",
]